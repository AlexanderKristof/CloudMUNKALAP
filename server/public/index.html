<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munkalapok</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#677085; --line:#dde1e8; --accent:#1f6feb; --danger:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e6e9ef; --muted:#9aa3b5; --line:#2e343e; --accent:#58a6ff; --danger:#ef5350; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.link { background:none; border:none; color:var(--accent); padding:0; }
  .filters { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td:first-child { white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--danger); }
  .table-wrap { overflow-x:auto; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); padding:12px; border-radius:8px; }
  #login { max-width:380px; margin:48px auto; }
  #login label { display:block; margin:12px 0 4px; }
  #login input { width:100%; }
  #login button { margin-top:16px; width:100%; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Munkalapok</h1>
  <div id="who" class="hidden"><span id="whoName"></span> · <button class="link" id="logout">Kilépés</button></div>
</header>

<main>
  <form id="login" class="card hidden">
    <h2 style="margin-top:0">Bejelentkezés</h2>
    <label for="name">Neved</label>
    <input id="name" autocomplete="name" required maxlength="60">
    <div id="keyWrap" class="hidden">
      <label for="appKey">Alkalmazáskulcs</label>
      <input id="appKey" type="password">
    </div>
    <button type="submit">Belépés</button>
    <p id="loginErr" class="err"></p>
  </form>

  <section id="appView" class="hidden">
    <form id="search" class="card filters">
      <input id="q" placeholder="Keresés (szám, ügyfél, szöveg)">
      <select id="user"><option value="">Mindenki</option></select>
      <input id="from" type="date" title="Dátumtól">
      <input id="to" type="date" title="Dátumig">
      <input id="allapot" placeholder="Állapot">
      <button type="submit">Keresés</button>
    </form>

    <div class="card">
      <p id="count" class="muted"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Dátum</th><th>Szám</th><th>Ügyfél</th><th>Állapot</th><th>Rögzítette</th><th>Utoljára módosítva</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p><button id="more" class="hidden">Továbbiak</button></p>
    </div>

    <div id="detail" class="card hidden">
      <button class="link" id="closeDetail">&larr; Vissza</button>
      <h2 id="detailTitle"></h2>
      <p id="detailMeta" class="muted"></p>
      <pre id="detailData"></pre>
      <h3>Korábbi változatok</h3>
      <div id="detailHistory" class="muted"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let token = store.get('munkalap_token');
let offset = 0;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') { showLogin(); throw new Error(body.error); }
  if (!res.ok) throw new Error(body.error || 'Hiba');
  return body;
}

const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('hu-HU') : '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function showLogin() {
  token = null; store.set('munkalap_token', null);
  $('appView').classList.add('hidden'); $('who').classList.add('hidden'); $('login').classList.remove('hidden');
  const cfg = await api('/config').catch(() => ({}));
  $('keyWrap').classList.toggle('hidden', !cfg.appKeyRequired);
}

async function showApp() {
  const me = await api('/me');
  $('whoName').textContent = me.user.name;
  $('login').classList.add('hidden'); $('who').classList.remove('hidden'); $('appView').classList.remove('hidden');
  const users = await api('/users');
  $('user').innerHTML = '<option value="">Mindenki</option>' + users.map((u) => `<option value="${u.id}">${esc(u.name)} (${u.worksheetCount})</option>`).join('');
  search(true);
}

async function search(reset) {
  if (reset) { offset = 0; $('rows').innerHTML = ''; }
  const p = new URLSearchParams({ limit: 50, offset });
  for (const k of ['q', 'user', 'from', 'to', 'allapot']) if ($(k).value) p.set(k, $(k).value);
  const r = await api('/worksheets?' + p);
  $('rows').insertAdjacentHTML('beforeend', r.items.map((w) => `
    <tr class="row" data-id="${esc(w.id)}">
      <td>${esc(w.datum)}</td><td>${esc(w.munkalapszam)}</td><td>${esc(w.ugyfel)}</td><td>${esc(w.allapot)}</td>
      <td>${esc(w.createdBy.name)}</td><td>${esc(w.updatedBy.name)}<br><span class="muted">${fmtDate(w.updatedAt)}</span></td>
    </tr>`).join(''));
  offset += r.items.length;
  $('count').textContent = `${r.total} találat`;
  $('more').classList.toggle('hidden', offset >= r.total);
}

async function openDetail(id) {
  const [w, hist] = await Promise.all([api('/worksheets/' + encodeURIComponent(id)), api('/worksheets/' + encodeURIComponent(id) + '/history')]);
  $('detailTitle').textContent = [w.munkalapszam, w.ugyfel].filter(Boolean).join(' – ') || w.id;
  $('detailMeta').textContent = `Rögzítette: ${w.createdBy.name} (${fmtDate(w.createdAt)}) · Módosította: ${w.updatedBy.name} (${fmtDate(w.updatedAt)})`
    + (w.device ? ` · Eszköz: ${w.device.name || w.device.id}` : '') + ` · ${w.version}. változat`;
  $('detailData').textContent = JSON.stringify(w.data, null, 2);
  $('detailHistory').innerHTML = hist.length
    ? hist.map((h) => `<details><summary>${h.version}. változat – ${esc(h.updatedBy.name)}, ${fmtDate(h.updatedAt)}${h.deleted ? ' (törölt)' : ''}</summary><pre>${esc(JSON.stringify(h.data, null, 2))}</pre></details>`).join('')
    : 'Nincs korábbi változat.';
  $('detail').classList.remove('hidden');
  $('detail').scrollIntoView({ behavior: 'smooth' });
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  try {
    const r = await api('/login', { method: 'POST', body: JSON.stringify({ name: $('name').value, appKey: $('appKey').value, deviceName: 'Böngésző' }) });
    token = r.token; store.set('munkalap_token', token);
    await showApp();
  } catch (err) { $('loginErr').textContent = err.message; }
});
$('logout').addEventListener('click', async () => { await api('/logout', { method: 'POST' }).catch(() => {}); showLogin(); });
$('search').addEventListener('submit', (e) => { e.preventDefault(); search(true); });
$('more').addEventListener('click', () => search(false));
$('rows').addEventListener('click', (e) => { const tr = e.target.closest('tr.row'); if (tr) openDetail(tr.dataset.id); });
$('closeDetail').addEventListener('click', () => $('detail').classList.add('hidden'));

token ? showApp().catch(() => {}) : showLogin();
</script>
</body>
</html>
